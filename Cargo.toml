[workspace]
members = [".", "cli", "unhwp-wasm"]
resolver = "2"

[package]
name = "unhwp"
version = "0.11.0"
edition = "2021"
authors = ["iyulab"]
description = "A high-performance library for extracting HWP/HWPX documents into structured Markdown"
license = "MIT"
repository = "https://github.com/iyulab/unhwp"
keywords = ["hwp", "hwpx", "korean", "document", "markdown"]
categories = ["parser-implementations", "text-processing"]
rust-version = "1.88"
documentation = "https://docs.rs/unhwp"

[features]
default = ["hwp5", "hwpx"]
hwp5 = []           # HWP 5.0 binary format support
hwpx = []           # HWPX XML format support
hwp3 = ["encoding_rs"]  # Legacy HWP 3.x support
async = ["tokio"]   # Async I/O support
ffi = []            # C-ABI FFI bindings

[dependencies]
# OLE container parsing (HWP 5.0)
cfb = "0.14"

# Compression
flate2 = "1.0"

# XML parsing (HWPX)
quick-xml = "0.42"

# Error handling
thiserror = "2.0"

# Shared plumbing for the un* family: error-kind numbering, C-ABI helpers, and
# (feature "refine") the lossless markdown shape-refinement pass behind
# RenderOptions.refine. unhwp keeps refine unconditional: its cleanup pipeline
# already depends on the same pulldown-cmark/pulldown-cmark-to-cmark pins
# declared below, so the feature adds no new crates to the dependency tree.
unparser-shared = { version = "0.2", default-features = false, features = ["refine"] }

# JSON serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Regular expressions (cleanup pipeline)
regex = "1.11"

# Unicode normalization (cleanup pipeline)
unicode-normalization = "0.1"

# Markdown parsing (cleanup pipeline Stage 3)
pulldown-cmark = { version = "0.13", default-features = false }
pulldown-cmark-to-cmark = "22"

# Optional: Legacy encoding (HWP 3.x)
encoding_rs = { version = "0.8", optional = true }

# ZIP archive (HWPX) — native: full features with bzip2/lzma/xz/zstd support.
# This is zip's default set minus aes-crypto. Nothing here reads an encrypted archive entry —
# HWPX carries no entry-level encryption, and HWP 5 encryption is handled at the compound-file
# layer in hwp5/ — so the AES decryptor is compiled in for no reader. It is also the only
# dependency in this graph that demands a newer rustc than everything else, which would raise the
# crate's minimum supported version on a capability no code path uses.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zip = { version = "8.6", default-features = false, features = [
    "deflate",
    "deflate64",
    "bzip2",
    "lzma",
    "xz",
    "zstd",
    "ppmd",
    "time",
] }
# Parallel processing (native only — rayon requires threading not available under wasm32)
rayon = "1.10"
# Optional: Async support
tokio = { version = "1.42", features = ["fs", "io-util", "rt", "macros"], optional = true }

# ZIP archive (HWPX) — wasm32: deflate-only (bzip2/lzma/xz/zstd require C libraries)
[target.'cfg(target_arch = "wasm32")'.dependencies]
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
criterion = "0.8"
tempfile = "3.14"
rand = "0.8"

[[bench]]
name = "parse_benchmark"
harness = false

[lib]
crate-type = ["lib", "cdylib"]
