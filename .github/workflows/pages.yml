name: Deploy WASM Playground

on:
  push:
    branches: [main]
    paths:
      - 'unhwp-wasm/**'
      - 'docs/**'
      - 'src/**'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: iyulab/unparser-shared/.github/workflows/pages-reusable.yml@main
    with:
      wasm-crate: unhwp-wasm
    permissions:
      contents: read
      pages: write
      id-token: write
