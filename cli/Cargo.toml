[package]
name = "unhwp-cli"
version = "0.10.0"
edition = "2021"
authors = ["iyulab"]
description = "Command-line tool for converting HWP/HWPX documents to Markdown"
license = "MIT"
repository = "https://github.com/iyulab/unhwp"
keywords = ["hwp", "hwpx", "cli", "converter"]
categories = ["command-line-utilities"]
rust-version = "1.88"

[[bin]]
name = "unhwp"
path = "src/main.rs"

[dependencies]
# Core library
unhwp = { version = "0.10.0", path = ".." }

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# JSON serialization
serde_json = "1.0"

# Self-update from GitHub releases
self_update = { version = "1.3", features = ["archive-zip", "archive-tar", "compression-tar-gz", "compression-zip-deflate"] }

# Staging directory and in-place binary replacement for the update flow. self_update stopped
# re-exporting these in 1.0; its own docs direct callers to depend on them directly.
tempfile = "3"
self-replace = "1.5"

# Version comparison
semver = "1.0"

# Progress indicator
indicatif = "0.18"

# Colored output
colored = "3.1"
