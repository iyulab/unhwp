[package]
name = "unhwp-cli"
version = "0.21.0"
edition = "2021"
authors = ["iyulab"]
description = "Command-line tool for converting HWP/HWPX documents to Markdown"
license = "MIT"
repository = "https://github.com/iyulab/unhwp"
keywords = ["hwp", "hwpx", "cli", "converter"]
categories = ["command-line-utilities"]
rust-version = "1.88"

[[bin]]
name = "unhwp"
path = "src/main.rs"

[dependencies]
# Core library
unhwp = { version = "0.21.0", path = ".." }

# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# JSON serialization
serde_json = "1.0"

# Progress indicator
indicatif = "0.18"

# Colored output
colored = "3.1"

# The update notice and the `update` command, shared by the family's CLIs.
unparser-shared = { version = "0.11", default-features = false, features = ["cli-update"] }

[dev-dependencies]
# Scratch directories for the CLI integration tests.
tempfile = "3"
# Builds the HWPX the `tables` test reads, from the committed fixture.
zip = { version = "9.0", default-features = false, features = ["deflate"] }
